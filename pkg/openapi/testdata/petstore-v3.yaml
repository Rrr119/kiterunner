openapi: 3.0.3
info:
  title: Petstore (OpenAPI 3)
  version: 1.0.0
servers:
  - url: https://petstore3.swagger.io/api/v3
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: api_key
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        default: 7
  requestBodies:
    PetBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
        application/xml:
          schema:
            $ref: '#/components/schemas/Pet'
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          default: category
    Pet:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int64
          default: 42
        name:
          type: string
          default: doggie
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        category:
          $ref: '#/components/schemas/Category'
paths:
  /pet:
    post:
      operationId: addPet
      requestBody:
        $ref: '#/components/requestBodies/PetBody'
      responses:
        '200':
          description: ok
    put:
      operationId: updatePet
      requestBody:
        $ref: '#/components/requestBodies/PetBody'
      responses:
        '200':
          description: ok
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
            default:
              - available
      responses:
        '200':
          description: ok
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPetById
      responses:
        '200':
          description: ok
    delete:
      operationId: deletePet
      responses:
        '200':
          description: ok
  /pet/{petId}/uploadImage:
    post:
      operationId: uploadFile
      parameters:
        - name: additionalMetadata
          in: query
          schema:
            type: string
            default: metadata
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: ok
  /store/inventory:
    get:
      operationId: getInventory
      responses:
        '200':
          description: ok
  /store/order:
    post:
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  default: 1
                petId:
                  type: integer
                  format: int64
                  default: 42
      responses:
        '200':
          description: ok
  /store/order/{orderId}:
    get:
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            default: 5
      responses:
        '200':
          description: ok
  /user/login:
    get:
      operationId: loginUser
      parameters:
        - name: username
          in: query
          schema:
            type: string
            default: user
        - name: password
          in: query
          schema:
            type: string
            default: password
      responses:
        '200':
          description: ok
  /user/{username}:
    get:
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            default: user
      responses:
        '200':
          description: ok
